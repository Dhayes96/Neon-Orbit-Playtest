# DIAGNOSTIC ONLY (diag/** branches). Measures audio vs wall clock and sequencer steps in the
# 10 s smoke run on WebKit (and Chromium for reference). Never merged to main.
name: WebKit smoke diagnostics
on:
  push:
    branches: ['diag/webkit-smoke']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: qa } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: qa/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Virtual audio device (same as the PR gate)
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=qa_null
          pactl set-default-sink qa_null
      - name: Machine
        run: nproc; uptime
      - name: WebKit x6
        continue-on-error: true
        run: npx playwright test tests/diag-smoke.spec.js --project=webkit-smoke --repeat-each=6 --workers=1 --retries=0 --reporter=line 2>&1 | tee wk.log
      - name: Chromium x3 (reference)
        continue-on-error: true
        run: npx playwright test tests/diag-smoke.spec.js --project=desktop-chrome --repeat-each=3 --workers=1 --retries=0 --reporter=line 2>&1 | tee cr.log
      - name: Summary
        if: always()
        run: for f in wk cr; do grep -h "^DIAGJSON" $f.log | sed "s/^/$f /"; done
