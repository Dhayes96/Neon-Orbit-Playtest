# Rhythm Void regression harness (Phase 1, T0). Harness lives in qa/.
name: Rhythm Void QA

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'        # nightly long timing/stress run (09:17 UTC)
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_DIR: ${{ github.workspace }}   # index.html lives at the repo root

jobs:
  fast:
    name: static + smoke (PR gate, ~2 min)
    runs-on: ubuntu-latest
    timeout-minutes: 35      # the gate has grown with each feature (about 22 min with Hyperdrive v3 and the boss-dodge suites)
    defaults: { run: { working-directory: qa } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: qa/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Static invariants
        run: npm run test:static
      - name: Virtual audio device (PulseAudio null sink, so Firefox's AudioContext can run)
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=qa_null
          pactl set-default-sink qa_null
      - name: Smoke (Chromium desktop + Pixel 7 emulation + Firefox + WebKit)
        if: ${{ !cancelled() }}   # run even while the Phase 2 static guards are still red
        run: npx playwright test tests/smoke.spec.js tests/mobile.spec.js --project=desktop-chrome --project=mobile-pixel7 --project=firefox-smoke --project=webkit-smoke
      - name: iPhone audio unlock on touchend/click (Chromium + WebKit, emulated iPhone)
        if: ${{ !cancelled() }}
        run: npx playwright test tests/crazygames-audio-resume.spec.js --project=desktop-chrome --project=webkit-smoke
      - name: CrazyGames build (build script + no external requests / banned strings)
        if: ${{ !cancelled() }}
        run: npx playwright test tests/crazygames-build.spec.js --project=desktop-chrome
      - name: iPhone rotation keeps touches aligned
        if: ${{ !cancelled() }}
        run: npx playwright test tests/rotation-touch.spec.js --project=desktop-chrome
      - name: HUD docks off the saucer at every size + pause Main Menu
        if: ${{ !cancelled() }}
        run: npx playwright test tests/hud-docks.spec.js --project=desktop-chrome
      - name: One-card tutorial + Liquid Glass controls
        if: ${{ !cancelled() }}
        run: npx playwright test tests/glass-tutorial.spec.js --project=desktop-chrome
      - name: Powers v2 (Hex Saw, Black Prism)
        if: ${{ !cancelled() }}
        run: npx playwright test tests/powers-v2.spec.js --project=desktop-chrome
      - name: Alien Fleet (Big Bang warp) + STAR-WARRIOR
        if: ${{ !cancelled() }}
        run: npx playwright test tests/fleet-starwarrior.spec.js --project=desktop-chrome
      - name: Score mode in the combo panel (no floating Fever banner)
        if: ${{ !cancelled() }}
        run: npx playwright test tests/combo-mode.spec.js --project=desktop-chrome
      - name: Project Zero (LVL 100 + stage 100 briefcase, files, Zero Form, Second Life)
        if: ${{ !cancelled() }}
        run: npx playwright test tests/project-zero.spec.js --project=desktop-chrome
      - name: Boss dodging + the Eclipse Sovereign (arrival, three spots, telegraphs, counter ring, hits)
        if: ${{ !cancelled() }}
        run: npx playwright test tests/eclipse-dodge.spec.js --project=desktop-chrome
      - name: Every boss's own dodge attack (crush, signal, feint, split, Metronox's clock, Nullstar's pull)
        if: ${{ !cancelled() }}
        run: npx playwright test tests/boss-dodge.spec.js --project=desktop-chrome
      - name: Hyperdrive (the flight draws, steers, fires, ends; a broken effect can't blank the field)
        if: ${{ !cancelled() }}
        run: npx playwright test tests/hyperdrive.spec.js --project=desktop-chrome
      - name: Bug sweep fixes (Hit Rate, Hyperdrive HUD and landscape layout)
        if: ${{ !cancelled() }}
        run: npx playwright test tests/sweep-fixes.spec.js --project=desktop-chrome
      - name: Hyperdrive v3 (slide to steer, tap to fire, 30 s, the first-flight card freezes time, space-time tunnel and black hole)
        if: ${{ !cancelled() }}
        run: npx playwright test tests/hyperdrive-v3.spec.js --project=desktop-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: fast-results, path: qa/results, retention-days: 14 }

  timing:
    name: timing + stress (nightly / manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: qa } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: qa/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Timing suite (grid alignment, BPM ramp, ear-bot, clock, visibility, frames)
        run: npm run test:timing
      - name: CPU-throttle stress
        run: npm run test:stress
        continue-on-error: true      # report-only until the scheduler fix lands
      - name: Summarise metrics into the job summary
        if: always()
        run: |
          node -e "const fs=require('fs');for(const f of fs.readdirSync('results').filter(f=>f.endsWith('.json')&&f!=='report.json')){const r=JSON.parse(fs.readFileSync('results/'+f));console.log('### '+f+'\n\`\`\`json\n'+JSON.stringify(r,(k,v)=>/(Sample|sample|allGaps|bpmTrace)/.test(k)?undefined:v,1).slice(0,3000)+'\n\`\`\`')}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: timing-results, path: qa/results, retention-days: 30 }

  lighthouse:
    name: Lighthouse CI (informational, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true   # performance audit is informational for now (Dennel, 2026-10-31)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g @lhci/cli@0.14.x
      - run: lhci autorun --collect.staticDistDir=. --assert.preset=lighthouse:no-pwa --assert.assertions.categories:performance=warn --upload.target=filesystem --upload.outputDir=lighthouse-reports
      - name: Keep the Lighthouse reports (private Actions artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: lighthouse-reports, path: "lighthouse-reports\n.lighthouseci", include-hidden-files: true, retention-days: 30 }
